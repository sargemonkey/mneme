<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Mneme.Studio</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; font-family: -apple-system, Segoe UI, Inter, sans-serif;
            background: #1a1d23; color: #d8dce5; font-size: 13px;
            display: grid; grid-template-rows: auto 1fr; height: 100vh;
        }
        header {
            background: #23272f; padding: 8px 16px;
            border-bottom: 1px solid #2e333d; display: flex; gap: 16px; align-items: center;
        }
        header h1 { margin: 0; font-size: 14px; font-weight: 600; }
        header .metrics { display: flex; gap: 16px; font-size: 11px; color: #8b96a8; }
        header .metrics b { color: #d8dce5; font-weight: 600; }
        header select, header button { background: #2e333d; color: #d8dce5; border: 1px solid #3a4150; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
        header button { cursor: pointer; }
        header button:hover { background: #3a4150; }
        header .live { color: #4ade80; font-size: 11px; }
        main {
            display: grid; grid-template-columns: 2fr 1fr; gap: 0;
            overflow: hidden;
        }
        section.events, section.log {
            overflow-y: auto; padding: 12px;
        }
        section.log { background: #1f232a; border-left: 1px solid #2e333d; }
        h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: #8b96a8; margin: 0 0 8px; }
        .event {
            background: #23272f; border: 1px solid #2e333d; border-radius: 6px;
            padding: 10px 12px; margin-bottom: 8px;
        }
        .event.revoked { opacity: 0.4; text-decoration: line-through; }
        .event-header { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
        .badge { font-size: 10px; padding: 2px 6px; border-radius: 3px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
        .badge.cat-Evidence   { background: #1e3a5f; color: #93c5fd; }
        .badge.cat-Fact       { background: #1e4a3f; color: #6ee7b7; }
        .badge.cat-Decision   { background: #4a3f1e; color: #fcd34d; }
        .badge.cat-Hypothesis { background: #4a1e3f; color: #f0abfc; }
        .badge.cat-Goal       { background: #5f3a1e; color: #fdba74; }
        .badge.cat-Action     { background: #3f1e4a; color: #c4b5fd; }
        .badge.cat-Outcome    { background: #1e4a4a; color: #67e8f9; }
        .badge.cls-Public       { background: #134e2a; color: #6ee7b7; }
        .badge.cls-Internal     { background: #1f2937; color: #9ca3af; }
        .badge.cls-Confidential { background: #5c3a0c; color: #fcd34d; }
        .badge.cls-Secret       { background: #5c0c0c; color: #fca5a5; }
        .badge.cls-Pii          { background: #0c4a5c; color: #67e8f9; }
        .event-id { font-family: ui-monospace, Consolas, monospace; font-size: 10px; color: #8b96a8; }
        .event-time { font-family: ui-monospace, Consolas, monospace; font-size: 10px; color: #8b96a8; margin-left: auto; }
        .event-body { color: #d8dce5; line-height: 1.4; margin: 4px 0; word-wrap: break-word; }
        .event-payload { font-family: ui-monospace, Consolas, monospace; font-size: 11px; color: #8b96a8;
                         background: #1a1d23; padding: 6px; border-radius: 4px; max-height: 200px; overflow: auto; margin-top: 6px; white-space: pre-wrap; }
        .actions { display: flex; gap: 6px; margin-top: 6px; }
        .actions button {
            background: transparent; color: #8b96a8; border: 1px solid #3a4150;
            padding: 2px 8px; border-radius: 3px; font-size: 11px; cursor: pointer;
        }
        .actions button:hover { background: #2e333d; color: #d8dce5; }
        .actions button.danger:hover { background: #5c0c0c; color: #fca5a5; border-color: #5c0c0c; }
        .actions button.pin:hover    { background: #134e2a; color: #6ee7b7; border-color: #134e2a; }
        .actions button.demote:hover { background: #5c3a0c; color: #fcd34d; border-color: #5c3a0c; }
        .empty { text-align: center; color: #8b96a8; padding: 40px; font-style: italic; }
        .curation { background: #23272f; padding: 8px 10px; border-radius: 4px; margin-bottom: 6px; font-size: 11px; }
        .curation.reverted { opacity: 0.4; text-decoration: line-through; }
        .curation .meta { color: #8b96a8; }
        .curation .target { font-family: ui-monospace, Consolas, monospace; }

        dialog {
            background: #23272f; color: #d8dce5; border: 1px solid #3a4150;
            border-radius: 8px; padding: 16px; min-width: 480px; max-width: 600px;
        }
        dialog::backdrop { background: rgba(0,0,0,0.5); }
        dialog h3 { margin: 0 0 12px; font-size: 14px; }
        dialog label { display: block; font-size: 11px; color: #8b96a8; margin: 8px 0 4px; }
        dialog input, dialog textarea {
            width: 100%; background: #1a1d23; color: #d8dce5; border: 1px solid #3a4150;
            border-radius: 4px; padding: 6px 8px; font-size: 12px; font-family: inherit;
        }
        dialog textarea { min-height: 80px; resize: vertical; }
        dialog .buttons { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
        dialog button { background: #2e333d; color: #d8dce5; border: 1px solid #3a4150; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        dialog button.primary { background: #3a4150; }
        dialog button.danger { background: #5c0c0c; }
        .error { background: #5c0c0c; color: #fca5a5; padding: 8px; border-radius: 4px; margin-top: 8px; font-size: 11px; }
    </style>
</head>
<body>
    <header>
        <h1>Mneme.Studio</h1>
        <span class="live" id="liveIndicator">● live</span>
        <div class="metrics">
            <span>events: <b id="mEvents">0</b></span>
            <span>revoked: <b id="mRevoked">0</b></span>
            <span>curations: <b id="mCurations">0</b></span>
        </div>
        <span style="margin-left: auto; font-size: 11px; color: #8b96a8;">
            workstream:
            <select id="wsPick"></select>
        </span>
        <button id="pickDbBtn" title="Switch SQLite database">📂 db</button>
        <span id="dbPath" style="font-size: 10px; color: #8b96a8; font-family: ui-monospace, monospace; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"></span>
    </header>
    <main>
        <section class="events">
            <h2>Events (newest first)</h2>
            <div id="events"></div>
        </section>
        <section class="log">
            <h2>Curation log</h2>
            <div id="curations"></div>
        </section>
    </main>

    <dialog id="dlg">
        <h3 id="dlgTitle"></h3>
        <div id="dlgBody"></div>
        <div id="dlgError"></div>
        <div class="buttons">
            <button id="dlgCancel">Cancel</button>
            <button id="dlgOk" class="primary">Apply</button>
        </div>
    </dialog>

    <script src="renderer.js"></script>
</body>
</html>
